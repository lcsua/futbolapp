name: Deploy Public Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public-web/**'
      - '.github/workflows/deploy-public-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./public-web
      run: dotnet restore

    - name: Build
      working-directory: ./public-web
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      working-directory: ./public-web
      run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true --output ./publish

    - name: Copy files via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "public-web/publish/*"
        target: "/home/lucas/apps/futbolnet/web"
        strip_components: 2

    - name: Configure and Restart Service
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          sudo tee /etc/systemd/system/futbolnet-web.service >/dev/null <<'EOF'
          [Unit]
          Description=FutbolNet Public Web
          After=network.target

          [Service]
          WorkingDirectory=/home/lucas/apps/futbolnet/web
          ExecStart=/home/lucas/apps/futbolnet/web/PublicWeb
          Restart=always
          RestartSec=10
          KillSignal=SIGINT
          SyslogIdentifier=futbolnet-web
          User=lucas
          Environment=ASPNETCORE_ENVIRONMENT=Production
          Environment=ASPNETCORE_URLS=http://127.0.0.1:5002
          Environment=BackendApi__BaseUrl=http://127.0.0.1:5143/api/public/

          [Install]
          WantedBy=multi-user.target
          EOF
          chmod +x /home/lucas/apps/futbolnet/web/PublicWeb
          sudo systemctl daemon-reload
          sudo systemctl enable futbolnet-web
          sudo systemctl restart futbolnet-web
          sudo systemctl is-active --quiet futbolnet-web
