name: Deploy Public Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public-web/**'
      - '.github/workflows/deploy-public-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./public-web
      run: dotnet restore

    - name: Build
      working-directory: ./public-web
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      working-directory: ./public-web
      run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true --output ./publish

    - name: Copy files via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "public-web/publish/*"
        target: "/home/lucas/apps/futbolnet/web"
        strip_components: 2

    - name: Start Public Web
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          pkill -f '/home/lucas/apps/futbolnet/web/PublicWeb' || true
          chmod +x /home/lucas/apps/futbolnet/web/PublicWeb
          cd /home/lucas/apps/futbolnet/web
          nohup env ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5002 BackendApi__BaseUrl=http://127.0.0.1:5143/api/public/ ./PublicWeb > public-web.log 2>&1 &
          sleep 5
          curl -fsS http://127.0.0.1:5002/ >/dev/null
