name: Deploy Public Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public-web/**'
      - '.github/workflows/deploy-public-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./public-web
      run: dotnet restore

    - name: Build
      working-directory: ./public-web
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      working-directory: ./public-web
      run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true --output ./publish

    - name: Copy files via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "public-web/publish/*"
        target: "/home/lucas/apps/futbolnet/web"
        strip_components: 2

    - name: Start Public Web
      uses: appleboy/ssh-action@v1.0.3
      env:
        SUDO_PASSWORD: ${{ secrets.SSH_SUDO_PASSWORD }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        envs: SUDO_PASSWORD
        script: |
          chmod +x /home/lucas/apps/futbolnet/web/PublicWeb

          if [ -n "$SUDO_PASSWORD" ]; then
            service_file="$(mktemp)"
            cat > "$service_file" <<'EOF'
          [Unit]
          Description=FutbolNet Public Web
          After=network.target

          [Service]
          WorkingDirectory=/home/lucas/apps/futbolnet/web
          ExecStart=/home/lucas/apps/futbolnet/web/PublicWeb
          Restart=always
          RestartSec=10
          KillSignal=SIGINT
          SyslogIdentifier=futbolnet-web
          User=lucas
          Environment=ASPNETCORE_ENVIRONMENT=Production
          Environment=ASPNETCORE_URLS=http://127.0.0.1:5002
          Environment=BackendApi__BaseUrl=http://127.0.0.1:5001/api/public/
          Environment=PublicWeb__PathBase=/public-web

          [Install]
          WantedBy=multi-user.target
          EOF
            nginx_patch="$(mktemp)"
            cat > "$nginx_patch" <<'PY'
          from pathlib import Path

          block = """    # BEGIN FUTBOLNET PUBLIC WEB
              location = /public-web {
                  return 301 /public-web/;
              }

              location /public-web/ {
                  proxy_pass http://127.0.0.1:5002;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /uploads/ {
                  proxy_pass http://127.0.0.1:5001;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              # END FUTBOLNET PUBLIC WEB
          """

          candidates = [
              *Path("/etc/nginx/sites-enabled").glob("*"),
              *Path("/etc/nginx/conf.d").glob("*.conf"),
          ]
          target = None
          for path in candidates:
              if not path.is_file() or path.name == "futbolnet-public-web.conf":
                  continue
              text = path.read_text()
              if "/backoffice/" in text or "ROOT OK" in text:
                  target = path
                  break

          if target is None:
              raise SystemExit("Could not find existing futbolnet nginx server config")

          text = target.read_text()
          start = text.find("# BEGIN FUTBOLNET PUBLIC WEB")
          end = text.find("# END FUTBOLNET PUBLIC WEB")
          if start != -1 and end != -1:
              end = text.find("\n", end)
              if end == -1:
                  end = len(text)
              text = text[:start] + block + text[end + 1:]
          else:
              marker = text.find("    location /backoffice/")
              if marker == -1:
                  marker = text.rfind("}")
              if marker == -1:
                  raise SystemExit(f"Could not find insertion point in {target}")
              text = text[:marker] + block + "\n" + text[marker:]

          target.write_text(text)
          PY
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mv "$service_file" /etc/systemd/system/futbolnet-web.service
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' rm -f /etc/nginx/conf.d/futbolnet-public-web.conf
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' python3 "$nginx_patch"
            rm -f "$nginx_patch"
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl daemon-reload
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl enable futbolnet-web
            pkill -x PublicWeb || true
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart futbolnet-web
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl is-active --quiet futbolnet-web
          else
            pkill -x PublicWeb || true
            cd /home/lucas/apps/futbolnet/web
            setsid env ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5002 BackendApi__BaseUrl=http://127.0.0.1:5001/api/public/ PublicWeb__PathBase=/public-web ./PublicWeb > public-web.log 2>&1 < /dev/null &
          fi

          sleep 5
          curl -fsS http://127.0.0.1:5001/api/public/liga >/dev/null
          curl -fsS https://miliga.com.ar/ligas | grep -q "Liga"
          curl -fsS http://127.0.0.1:5002/public-web/ >/dev/null
