name: Deploy Public Web

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'public-web/**'
      - '.github/workflows/deploy-public-web.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.0.x'

    - name: Restore dependencies
      working-directory: ./public-web
      run: dotnet restore

    - name: Build
      working-directory: ./public-web
      run: dotnet build --configuration Release --no-restore

    - name: Publish
      working-directory: ./public-web
      run: dotnet publish --configuration Release --runtime linux-x64 --self-contained true --output ./publish

    - name: Copy files via SSH
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "public-web/publish/*"
        target: "/home/lucas/apps/futbolnet/web"
        strip_components: 2

    - name: Start Public Web
      uses: appleboy/ssh-action@v1.0.3
      env:
        SUDO_PASSWORD: ${{ secrets.SSH_SUDO_PASSWORD }}
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        envs: SUDO_PASSWORD
        script: |
          chmod +x /home/lucas/apps/futbolnet/web/PublicWeb

          if [ -n "$SUDO_PASSWORD" ]; then
            service_file="$(mktemp)"
            cat > "$service_file" <<'EOF'
          [Unit]
          Description=FutbolNet Public Web
          After=network.target

          [Service]
          WorkingDirectory=/home/lucas/apps/futbolnet/web
          ExecStart=/home/lucas/apps/futbolnet/web/PublicWeb
          Restart=always
          RestartSec=10
          KillSignal=SIGINT
          SyslogIdentifier=futbolnet-web
          User=lucas
          Environment=ASPNETCORE_ENVIRONMENT=Production
          Environment=ASPNETCORE_URLS=http://127.0.0.1:5002
          Environment=BackendApi__BaseUrl=http://127.0.0.1:5143/api/public/
          Environment=PublicWeb__PathBase=/public-web

          [Install]
          WantedBy=multi-user.target
          EOF
            nginx_file="$(mktemp)"
            cat > "$nginx_file" <<'EOF'
          server {
              listen 80;
              server_name 194.163.129.125;

              location = / {
                  return 200 "ROOT OK";
              }

              location = /public-web {
                  return 301 /public-web/;
              }

              location /public-web/ {
                  proxy_pass http://127.0.0.1:5002;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location /backoffice/ {
                  alias /home/lucas/apps/futbolnet/backoffice/;
                  try_files $uri $uri/ /backoffice/index.html;
              }

              location /api/ {
                  proxy_pass http://127.0.0.1:5143/api/;
                  proxy_http_version 1.1;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          EOF
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mv "$service_file" /etc/systemd/system/futbolnet-web.service
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' mv "$nginx_file" /etc/nginx/conf.d/futbolnet-public-web.conf
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' nginx -t
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl reload nginx
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl daemon-reload
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl enable futbolnet-web
            pkill -x PublicWeb || true
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl restart futbolnet-web
            printf '%s\n' "$SUDO_PASSWORD" | sudo -S -p '' systemctl is-active --quiet futbolnet-web
          else
            pkill -x PublicWeb || true
            cd /home/lucas/apps/futbolnet/web
            setsid env ASPNETCORE_ENVIRONMENT=Production ASPNETCORE_URLS=http://127.0.0.1:5002 BackendApi__BaseUrl=http://127.0.0.1:5143/api/public/ PublicWeb__PathBase=/public-web ./PublicWeb > public-web.log 2>&1 < /dev/null &
          fi

          sleep 5
          curl -fsS http://127.0.0.1:5002/public-web/ >/dev/null
